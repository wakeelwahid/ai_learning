version: "3.8"

services:
  ai_service:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ai_service_postgres:5432/${POSTGRES_DB}"
      POSTGRES_HOST: "ai_service_postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@ai_service_redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@ai_service_redis:6379/0"
    restart: unless-stopped
    depends_on:
      ai_service_postgres:
        condition: service_healthy
      ai_service_redis:
        condition: service_healthy
    networks:
      ai_service_net: {}
      edulearn_net:
        aliases:
          - ai_service
      # Qdrant (infra-qdrant-1, aliased "qdrant") lives on edtech_net, a
      # network defined in the separate infra/ compose project — without
      # joining it, "qdrant" doesn't resolve at all (DNS failure, not a
      # connection refusal) and every RAG call (study mode, question
      # generation, paper generation) fails. Same class of cross-project
      # network gap already found and fixed for Prometheus's scrape targets.
      edtech_net: {}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3
      start_period: 40s

  ai_celery_worker:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app worker -Q ai.generation,ai.questions,ai.rag,ai.embedding,ai.upload,ai.indexing -c 2 --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ai_service_postgres:5432/${POSTGRES_DB}"
      POSTGRES_HOST: "ai_service_postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@ai_service_redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@ai_service_redis:6379/0"
      CELERY_WORKER: "true"
    restart: unless-stopped
    depends_on:
      ai_service_postgres:
        condition: service_healthy
      ai_service_redis:
        condition: service_healthy
    networks:
      - ai_service_net
      - edtech_net

  ai_service_postgres:
    image: postgres:15-alpine
    container_name: ai_service_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ai_service_postgres_data:/var/lib/postgresql/data
    networks:
      - ai_service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai_service_redis:
    image: redis:7-alpine
    container_name: ai_service_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ai_service_redis_data:/data
    networks:
      - ai_service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_pass} ping | grep -q PONG"]
      interval: 30s
      retries: 3
      start_period: 40s
networks:
  ai_service_net:
    driver: bridge
  edulearn_net:
    external: true
    name: edulearn_net
  edtech_net:
    external: true
    name: edtech_net

volumes:
  ai_service_postgres_data:
  ai_service_redis_data:
version: "3.8"

services:
  notification_service:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notification_service_postgres:5432/${POSTGRES_DB}"
      POSTGRES_HOST: "notification_service_postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@notification_service_redis:6379/0"
    restart: unless-stopped
    depends_on:
      notification_service_postgres:
        condition: service_healthy
      notification_service_redis:
        condition: service_healthy
    networks:
      notification_service_net: {}
      edulearn_net:
        aliases:
          - notification_service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3
      start_period: 40s

  # Single, unscaled "Daily Jobs Scheduler" process — owns the one APScheduler
  # instance for the whole deployment. Must never be scaled beyond 1 replica;
  # notification_service's own 4 uvicorn workers deliberately do NOT run the
  # scheduler themselves (see app/scheduler_main.py for why).
  notification_scheduler:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.scheduler_main
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notification_service_postgres:5432/${POSTGRES_DB}"
      POSTGRES_HOST: "notification_service_postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@notification_service_redis:6379/0"
    restart: unless-stopped
    depends_on:
      notification_service:
        condition: service_healthy
      notification_service_postgres:
        condition: service_healthy
      notification_service_redis:
        condition: service_healthy
    networks:
      - notification_service_net
      - edulearn_net

  notification_celery_worker:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app worker -Q notifications.email,notifications.push,notifications.whatsapp -c 2 --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notification_service_postgres:5432/${POSTGRES_DB}"
      POSTGRES_HOST: "notification_service_postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@notification_service_redis:6379/0"
    restart: unless-stopped
    depends_on:
      notification_service_postgres:
        condition: service_healthy
      notification_service_redis:
        condition: service_healthy
    networks:
      - notification_service_net

  notification_service_postgres:
    image: postgres:15-alpine
    container_name: notification_service_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notification_service_postgres_data:/var/lib/postgresql/data
    networks:
      - notification_service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification_service_redis:
    image: redis:7-alpine
    container_name: notification_service_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - notification_service_redis_data:/data
    networks:
      - notification_service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_pass} ping | grep -q PONG"]
      interval: 30s
      retries: 3
      start_period: 40s
networks:
  notification_service_net:
    driver: bridge
  edulearn_net:
    external: true
    name: edulearn_net

volumes:
  notification_service_postgres_data:
  notification_service_redis_data:
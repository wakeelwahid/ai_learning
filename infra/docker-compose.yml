services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edtech
    # Phase 1: tune for 50k-user scale
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
    - 5450:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - edtech

  # Phase 1: PgBouncer — transaction-mode connection pooler
  # All 11 services connect to pgbouncer:5432; PgBouncer holds 25 real PG connections
  # supporting 500+ client-side connections from microservices
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_AUTH_TYPE: md5
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: 0
      PGBOUNCER_LOG_CONNECTIONS: 0
      PGBOUNCER_LOG_DISCONNECTIONS: 0
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 5455:6432
    networks:
    - edtech

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edtech}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-edtech_rabbit}
      # Phase 7: pre-declare queues and enable management plugin features
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
    - 5672:5672
    - 15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_port_connectivity
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
    - edtech

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
    - qdrant_data:/qdrant/storage
    ports:
    - 6335:6333
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
    - edtech

  # Phase 4: Redis — 4GB, volatile-lru so critical state is never evicted
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 4gb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 511
      --tcp-keepalive 300
      --timeout 0
      --loglevel notice
      --databases 16
    volumes:
    - redis_data:/data
    ports:
    - 6381:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - edtech

  # Phase 14: Prometheus monitoring
  #
  # Also joins edulearn_net (the microservices' own network — each service's
  # docker-compose.yml lives outside this infra/ project and its own
  # network, not edtech_net) so container-name DNS resolution actually
  # reaches every /metrics target declared in prometheus.yml. Without this,
  # every microservice scrape target 404s on DNS lookup even though the
  # config looks correct — this bit the original "Phase 14" build silently,
  # since api_gateway happened to already sit on both networks and was the
  # only target anyone spot-checked.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
    - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    - prometheus_data:/prometheus
    ports:
    - 9090:9090
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --web.enable-lifecycle
    depends_on:
    - alertmanager
    networks:
    - edtech
    - edulearn

  # Phase 14: Alertmanager — receives firing alerts from Prometheus
  # (monitoring/prometheus/alert_rules.yml) and routes them to a
  # notification channel (email, configured in
  # monitoring/alertmanager/alertmanager.yml — placeholder SMTP values,
  # must be filled in with real credentials before launch).
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
    - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager_data:/alertmanager
    ports:
    - 9093:9093
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    networks:
    - edtech

  # Phase 14: Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
    - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    ports:
    - 3100:3000
    depends_on:
    - prometheus
    networks:
    - edtech

  # Phase 14: Redis exporter for Prometheus
  redis_exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
    - 9121:9121
    depends_on:
    - redis
    networks:
    - edtech

  # Phase 14: PostgreSQL exporter
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/edtech?sslmode=disable"
    ports:
    - 9187:9187
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - edtech

networks:
  edtech:
    external: true
    name: edtech_net
  # The microservices' shared network — declared here only so Prometheus can
  # join it too (see the comment on the prometheus service above).
  edulearn:
    external: true
    name: edulearn_net

volumes:
  postgres_data:
    external: true
    name: task_postgres_data
  redis_data:
    external: true
    name: task_redis_data
  qdrant_data:
    external: true
    name: task_qdrant_data
  rabbitmq_data:
    external: true
    name: task_rabbitmq_data
  prometheus_data:
    external: true
    name: task_prometheus_data
  grafana_data:
    external: true
    name: task_grafana_data
  alertmanager_data:
    external: true
    name: task_alertmanager_data

## RabbitMQ configuration for EduLearn 50,000-user production upgrade
## Mounted into the container at /etc/rabbitmq/rabbitmq.conf

# ── Networking ────────────────────────────────────────────────────────────────
listeners.tcp.default = 5672
management.tcp.port   = 15672

# ── Resource limits ───────────────────────────────────────────────────────────
# Allow up to 2,048 simultaneous connections (11 services × up to 50 Celery workers)
connection_max = 2048
channel_max    = 128

# Memory high-watermark: pause publishers if RabbitMQ uses >60% of system RAM.
# Container is capped at 1GB → 600MB trigger.
vm_memory_high_watermark.relative = 0.60

# Disk free alarm: reject publishes when < 1GB free on the data volume.
disk_free_limit.absolute = 1GB

# ── Message persistence ───────────────────────────────────────────────────────
# Default exchange durability — queues must also be declared durable by producers.
# (Celery uses durable queues by default.)

# ── Flow control ─────────────────────────────────────────────────────────────
# Per-connection credit: controls how many frames a connection can send before
# the broker must acknowledge them. Lower values throttle fast producers.
heartbeat = 60

# ── Queue mirroring / quorum queues ──────────────────────────────────────────
# Enable quorum queues for reliability (replaces classic mirrored queues).
# Celery queues created with x-queue-type=quorum will survive a broker restart.
# NOTE: set this in the Celery queue declaration, not here.

# ── Logging ──────────────────────────────────────────────────────────────────
log.console          = true
log.console.level    = warning
log.file             = false

# ── Management plugin ────────────────────────────────────────────────────────
management.load_definitions = /etc/rabbitmq/definitions.json

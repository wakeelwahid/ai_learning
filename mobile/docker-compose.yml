services:
  mobile:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # --web serves the browser build directly, matching the Dockerfile's own
    # default CMD (kept explicit here in case this command: override is ever
    # changed independently of the Dockerfile).
    command: npx expo start --web --host lan
    # Metro bundler (8081) + Expo dev server (19000/19006)
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19006:19006"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - edtech

networks:
  edtech:
    external: true
    name: edtech_net

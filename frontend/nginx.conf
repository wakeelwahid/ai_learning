server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current hashed JS/CSS bundle — if a browser
    # caches it, a fresh deploy silently keeps serving the old app with no
    # visible error (observed on the admin app's identical config).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api {
        proxy_pass http://api_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
}

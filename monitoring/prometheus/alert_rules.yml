groups:
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} at {{ $labels.instance }} for over 1 minute."

  - name: error-rates
    rules:
      - alert: HighServerErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is returning >5% 5xx responses"
          description: "{{ $labels.job }} has had a 5xx error rate above 5% for the last 5 minutes. Real users are seeing failures."

  - name: latency
    rules:
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency above 2s"
          description: "{{ $labels.job }}'s 95th-percentile response time has been above 2 seconds for 5 minutes."

  - name: infrastructure
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter reports the database as unreachable"
          description: "postgres_exporter has been unable to reach its target Postgres instance for over 1 minute."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter reports Redis as unreachable"
          description: "redis_exporter has been unable to reach its target Redis instance for over 1 minute."

      - alert: HighPostgresConnections
        expr: sum(pg_stat_activity_count) / on() pg_settings_max_connections > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection pool above 85% of max_connections"
          description: "Active Postgres connections have been above 85% of the configured max_connections for 5 minutes — new connections may soon start failing."
